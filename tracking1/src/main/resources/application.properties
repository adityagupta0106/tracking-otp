spring.profiles.active=configure

spring.application.name=TRACKINGSERVICE
server.port=10031

server.servlet.context-path=/tracking

#Kafka Conf
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Feign Client URLs

filemanagement.service.url=http://localhost:9090
formdesigner.service.url=http://10.1.11.126:9093
instanceconfigregistry.service.url=http://10.1.11.100:9091
processing.service.url=http://10.1.11.100:9095
servicemetadata.service.url=http://10.1.11.126:8091
usermanagement.service.url=http://10.1.11.100:8080

spring.cloud.openfeign.client.config.UserManagement.connectTimeout=2000
spring.cloud.openfeign.client.config.UserManagement.readTimeout=5000
spring.cloud.openfeign.client.config.formDesigner.connectTimeout=2000
spring.cloud.openfeign.client.config.formDesigner.readTimeout=5000
spring.cloud.openfeign.client.config.SERVICEMETADATA.connectTimeout=2000
spring.cloud.openfeign.client.config.SERVICEMETADATA.readTimeout=5000
tracking.public.enabled=${TRACKING_PUBLIC_ENABLED:true}

