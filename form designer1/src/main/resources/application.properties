#server port
server.port=9093

server.servlet.context-path=/formmgmt
spring.application.name=formDesigner

# Configure / local DB
app.mongodb.configure.database=local
app.mongodb.configure.uri=mongodb://root:root@10.1.11.126:8081/local?authSource=admin

# Production DB
app.mongodb.production.database=form_mgmt_prod
app.mongodb.production.uri=mongodb://root:root@10.1.11.126:8081/form_mgmt_prod?authSource=admin

# PostgreSQL datasource
spring.datasource.url = jdbc:postgresql://10.1.11.100:9093/sp_form_mgmt
spring.datasource.username = postgres
spring.datasource.password = postgres
spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


logging.level.org.springframework.data.mongodb.core.MongoTemplate=TRACE

#eureka
eureka.client.service-url.defaultZone=http://10.1.11.100:7070/eureka/
eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

#redis
spring.data.redis.host=10.1.11.100
spring.data.redis.port=6379

spring.data.redis.password=password_new
spring.data.redis.connect-timeout=1000ms
spring.data.redis.timeout=1000ms

#kafka config
spring.kafka.bootstrap-servers=10.1.11.100:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


#elasticsearch
elasticsearch.host=10.1.11.126
elasticsearch.port=8091
elasticsearch.index.form-search=form_search


form.validation.jwt.public-key=classpath:keys/public_key.pem
form.validation.jwt.expiry.minutes=180

#Unique Id generator config
id.generator.worker.id = 1
id.generator.datacenter.id =1

#master 
master.createdBy=SYSTEM

#application data
max.form.data=100000

#tiny URL
tiny.url.prod=http://10.1.11.35:8082/stand-alone/
tiny.url.configure=http://10.1.11.35:8082/stand-alone/
max.token.generation.attempts=5

kafka.publish.form.data.topic = publish-used-attribute-form-data
# Public tracking dependencies fail closed; do not retry OTP mutations automatically.
spring.cloud.openfeign.client.config.SERVICEMETADATA.connectTimeout=2000
spring.cloud.openfeign.client.config.SERVICEMETADATA.readTimeout=5000
